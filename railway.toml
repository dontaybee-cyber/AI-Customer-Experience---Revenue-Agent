[[services]]
name = "api"
source = "apps/api"

  [services.build]
  dockerfilePath = "Dockerfile"
  dockerTarget = "api"

  [services.deploy]
  startCommand = "node dist/server.js"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

[[services]]
name = "worker"
source = "apps/api"

  [services.build]
  dockerfilePath = "Dockerfile"
  dockerTarget = "worker"

  [services.deploy]
  startCommand = "node dist/worker.js"
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3